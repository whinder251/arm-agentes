{% extends 'panel/base.html' %}

{% block content %}
<div class="integraciones">
    <h1>Integraciones y API</h1>
    <p class="subtitulo">Clave para autenticar peticiones a la API REST de ARM.</p>

    <div class="tarjeta">
        <h3>ARM_API_KEY</h3>
        <div class="api-key-fila">
            <code id="api-key">{{ arm_api_key }}</code>
            <button type="button" class="btn-primary" onclick="copiarClave()">Copiar</button>
        </div>
        <p class="subtexto">Mantén esta clave segura. Es requerida para autenticar peticiones a la API REST de ARM.</p>
    </div>
</div>
{% endblock %}

<script>
function copiarClave() {
    const clave = document.getElementById('api-key').textContent;
    navigator.clipboard.writeText(clave).then(function() {
        const btn = document.querySelector('button[onclick="copiarClave()"]');
        const textoOriginal = btn.textContent;
        btn.textContent = 'Copiado';
        setTimeout(function() { btn.textContent = textoOriginal; }, 1500);
    });
}
</script>
