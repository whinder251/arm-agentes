{% extends "panel/base.html" %}

{% block content %}
<div class="pagina-crear">
    <a class="volver" href="{% url 'lista_tareas' %}">&larr; Volver al listado</a>

    <div class="tarjeta">
        <h1>Nueva tarea</h1>
        <p class="subtitulo">
            Cuéntale al agente qué quieres procesar. La tarea se encola al enviarla.
        </p>

        {% if error %}
            <div class="alerta-error" role="alert">{{ error }}</div>
        {% endif %}

        <form method="post" novalidate>
            {% csrf_token %}

            <div class="form-group">
                <label for="texto">Contenido</label>
                <textarea id="texto" name="texto" rows="12" class="input" required
                          placeholder="Escribe o pega aquí el contenido que quieres procesar...">{{ request.POST.texto|default:"" }}</textarea>
            </div>

            <div class="fila-campos">
                <div class="form-group">
                    <label for="keyword">Keyword <span class="opcional">(opcional)</span></label>
                    <input type="text" id="keyword" name="keyword" class="input"
                           placeholder="ej. energía solar"
                           value="{{ request.POST.keyword|default:"" }}">
                </div>

                <div class="form-group">
                    <label for="agente_id">Agente <span class="opcional">(opcional)</span></label>
                    <select id="agente_id" name="agente_id" class="input">
                        <option value="">Asignación automática</option>
                        {% for agente in agentes %}
                            <option value="{{ agente.pk }}"{% if request.POST.agente_id == agente.pk|stringformat:"s" %} selected{% endif %}>
                                {{ agente.nombre }} (Modelo: {{ agente.modelo.model_id|default:"sin modelo" }})
                            </option>
                        {% endfor %}
                    </select>
                    <span class="ayuda">Si lo dejas en blanco se usará el primer agente con modelo activo.</span>
                </div>
            </div>

            <div class="form-group">
                <label for="instrucciones">Instrucciones adicionales <span class="opcional">(opcional)</span></label>
                <textarea id="instrucciones" name="instrucciones" rows="3" class="input"
                          placeholder="Tono, audiencia o cualquier detalle extra para el agente...">{{ request.POST.instrucciones|default:"" }}</textarea>
            </div>

            <div class="acciones-formulario">
                <button type="submit" class="btn-primary">Procesar con IA</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
