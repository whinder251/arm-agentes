[project]
name = "arm"
version = "0.1.0"
description = "Núcleo independiente de contratos y Tool Gateway de ARM"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["arm*"]
